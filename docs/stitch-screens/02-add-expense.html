<!DOCTYPE html>

<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Catat Pengeluaran - Family CFO</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#62df7d",
              "background-dark": "#020617",
              "surface-dark": "#0f172a",

              "on-primary": "#003914",
              "background": "#0e150f",
              "on-tertiary-fixed": "#3f0016",
              "surface-container-highest": "#30372f",
              "on-secondary-fixed-variant": "#005321",
              "warning": "#f59e0b",
              "primary-container": "#1ca64d",
              "surface-container-low": "#171d16",
              "surface-container": "#1b211a",
              "on-secondary": "#003915",
              "on-surface": "#dde5d9",
              "info": "#6366f1",
              "error-container": "#93000a",
              "on-secondary-container": "#004119",
              "tertiary-container": "#ec6284",
              "on-tertiary-fixed-variant": "#8a143c",
              "on-background": "#dde5d9",
              "surface-container-lowest": "#09100a",
              "secondary": "#4ae176",
              "primary-fixed-dim": "#62df7d",
              "outline-variant": "#3e4a3d",
              "surface-bright": "#343b33",
              "on-surface-variant": "#bdcaba",
              "tertiary": "#ffb2bf",
              "primary-fixed": "#7ffc97",
              "danger": "#ef4444",
              "surface-light": "#ffffff",
              "on-primary-container": "#003111",
              "background-light": "#f8fafc",
              "on-tertiary-container": "#5a0022",
              "inverse-primary": "#006e2d",
              "outline": "#879485",
              "surface-tint": "#62df7d",
              "on-error": "#690005",
              "on-error-container": "#ffdad6",
              "error": "#ffb4ab",
              "on-primary-fixed": "#002109",
              "surface-container-high": "#252c24",
              "tertiary-fixed-dim": "#ffb2bf",
              "tertiary-fixed": "#ffd9de",
              "secondary-container": "#00b954",
              "on-primary-fixed-variant": "#005320",
              "secondary-fixed": "#6bff8f",
              "inverse-surface": "#dde5d9",
              "secondary-fixed-dim": "#4ae176",
              "surface-variant": "#30372f",
              "on-tertiary": "#660027"
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            spacing: {
              "container-padding": "1rem",
              "stack-sm": "0.5rem",
              "stack-md": "1rem",
              "stack-lg": "1.5rem",
              "gutter": "1rem"
            },
            fontFamily: {
              "currency-display": ["Space Grotesk"],
              "label-sm": ["Inter"],
              "headline-md": ["Space Grotesk"],
              "data-mono": ["JetBrains Mono"],
              "headline-lg": ["Space Grotesk"],
              "body-md": ["Inter"],
              "body-lg": ["Inter"]
            },
            fontSize: {
              "currency-display": ["28px", { lineHeight: "34px", letterSpacing: "-0.01em", fontWeight: "700" }],
              "label-sm": ["12px", { lineHeight: "16px", fontWeight: "600" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "data-mono": ["14px", { lineHeight: "20px", fontWeight: "500" }],
              "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }]
            }
          }
        }
      }

<style>
        /* Hide scrollbar for clean chip row */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-on-surface font-body-md antialiased min-h-screen pb-20 flex flex-col items-center">
<!-- Mobile Container Constraint -->
<div class="w-full max-w-[390px] min-h-screen relative shadow-2xl bg-background-dark flex flex-col">
<!-- Top Header -->
<header class="flex justify-between items-center px-container-padding py-stack-md w-full bg-background-dark top-0 sticky z-40 border-b border-outline shadow-[0px_2px_0px_0px_rgba(0,0,0,1)]">
<button class="text-on-surface-variant p-2 -ml-2 active:bg-surface-container rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary-fixed tracking-tight">Catat Pengeluaran</h1>
<div class="w-10"></div> <!-- Spacer for flex balance -->
</header>
<!-- Main Content -->
<main class="flex-1 px-container-padding py-stack-lg space-y-stack-lg overflow-y-auto">
<!-- Nominal Input (Neo-Brutalist) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Nominal</label>
<div class="flex items-center bg-surface-dark border-2 border-outline rounded-xl p-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus-within:border-primary-fixed focus-within:shadow-[4px_4px_0px_0px_rgba(98,223,125,0.3)] transition-all">
<span class="font-currency-display text-currency-display text-primary-fixed mr-3">Rp</span>
<input class="bg-transparent w-full font-currency-display text-currency-display text-on-surface focus:outline-none placeholder-outline-variant" placeholder="0" type="number"/>
<button class="text-on-surface-variant hover:text-primary-fixed active:scale-95 transition-all p-1 bg-surface-container rounded-lg border border-outline shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
<span class="material-symbols-outlined text-[28px]">calculate</span>
</button>
</div>
</div>
<!-- Voice Recording Card -->
<div class="bg-surface border-2 border-outline rounded-2xl p-stack-lg shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex flex-col items-center justify-center text-center gap-stack-md relative overflow-hidden group">
<!-- Subtle background glow effect -->
<div class="absolute inset-0 opacity-0 group-hover:opacity-10 bg-[radial-gradient(circle_at_center,theme(colors.primary-fixed)_0,transparent_70%)] transition-opacity duration-500 pointer-events-none"></div>
<button class="w-20 h-20 rounded-full bg-primary flex items-center justify-center border-2 border-[#000] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-y-1 active:translate-x-1 active:shadow-[0px_0px_0px_0px_rgba(0,0,0,1)] transition-all z-10">
<span class="material-symbols-outlined text-on-secondary-fixed font-bold text-4xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<div class="z-10 mt-2 space-y-1">
<p class="font-data-mono text-data-mono text-primary-fixed bg-surface-container px-3 py-1 rounded-full border border-outline inline-block shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">00:00</p>
<p class="font-label-sm text-label-sm text-on-surface-variant max-w-[250px] mx-auto mt-2 leading-relaxed">Sebutkan belanjaan sekaligus, AI akan memisahkan otomatis</p>
</div>
</div>
<!-- Frequent Categories (Chips) -->
<div class="flex gap-stack-sm overflow-x-auto pb-2 scrollbar-hide -mx-container-padding px-container-padding">
<button class="whitespace-nowrap px-5 py-2.5 bg-surface-container border border-outline rounded-full font-label-sm text-label-sm text-on-surface active:bg-primary-fixed active:text-on-secondary-fixed active:border-primary-fixed shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-[2px] transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">restaurant</span>
                    Makan
                </button>
<button class="whitespace-nowrap px-5 py-2.5 bg-surface-container border border-outline rounded-full font-label-sm text-label-sm text-on-surface active:bg-primary-fixed active:text-on-secondary-fixed active:border-primary-fixed shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-[2px] transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">shopping_cart</span>
                    Groceries
                </button>
<button class="whitespace-nowrap px-5 py-2.5 bg-surface-container border border-outline rounded-full font-label-sm text-label-sm text-on-surface active:bg-primary-fixed active:text-on-secondary-fixed active:border-primary-fixed shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-[2px] transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">local_gas_station</span>
                    Bensin
                </button>
<button class="whitespace-nowrap px-5 py-2.5 bg-surface-container border border-outline rounded-full font-label-sm text-label-sm text-on-surface active:bg-primary-fixed active:text-on-secondary-fixed active:border-primary-fixed shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-[2px] transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">more_horiz</span>
</button>
</div>
<!-- Form Details -->
<div class="space-y-stack-lg">
<!-- Description Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Nama Kebutuhan</label>
<input class="bg-surface border border-outline rounded-xl p-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-fixed shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:shadow-[2px_2px_0px_0px_rgba(98,223,125,0.5)] transition-all placeholder-outline-variant" placeholder="Contoh: Makan siang Nasi Padang" type="text"/>
</div>
<!-- Category Grid (3 Columns) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Kategori Utama</label>
<div class="grid grid-cols-3 gap-stack-sm">
<button class="flex flex-col items-center justify-center p-3 bg-surface-container border border-outline rounded-xl gap-2 active:bg-surface-container-highest active:border-primary-fixed transition-all group shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-[2px]">
<div class="w-10 h-10 rounded-full bg-surface-dark border border-outline flex items-center justify-center text-on-surface-variant group-active:text-primary-fixed group-active:border-primary-fixed">
<span class="material-symbols-outlined">restaurant</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Makan</span>
</button>
<button class="flex flex-col items-center justify-center p-3 bg-surface-container border border-outline rounded-xl gap-2 active:bg-surface-container-highest active:border-primary-fixed transition-all group shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-[2px]">
<div class="w-10 h-10 rounded-full bg-surface-dark border border-outline flex items-center justify-center text-on-surface-variant group-active:text-primary-fixed group-active:border-primary-fixed">
<span class="material-symbols-outlined">directions_car</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Transport</span>
</button>
<button class="flex flex-col items-center justify-center p-3 bg-surface-container border border-outline rounded-xl gap-2 active:bg-surface-container-highest active:border-primary-fixed transition-all group shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-[2px]">
<div class="w-10 h-10 rounded-full bg-surface-dark border border-outline flex items-center justify-center text-on-surface-variant group-active:text-primary-fixed group-active:border-primary-fixed">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Belanja</span>
</button>
</div>
</div>
<!-- Date & Goal Dropdowns -->
<div class="grid grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Tanggal</label>
<button class="flex items-center bg-surface border border-outline rounded-xl p-3 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-[2px] active:shadow-none transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-2 text-[20px]">calendar_today</span>
<span class="font-data-mono text-data-mono text-on-surface flex-1 text-left">Hari Ini</span>
</button>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Event/Goal</label>
<button class="flex items-center bg-surface border border-outline rounded-xl p-3 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-[2px] active:shadow-none transition-all">
<span class="font-body-md text-body-md text-on-surface-variant flex-1 truncate text-left">Opsional</span>
<span class="material-symbols-outlined text-on-surface-variant">unfold_more</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-secondary-fixed font-headline-md text-headline-md py-4 rounded-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-y-[4px] active:translate-x-[4px] active:shadow-[0px_0px_0px_0px_rgba(0,0,0,1)] transition-all font-bold mt-stack-lg border-2 border-transparent hover:border-[#000]">
                Simpan Pengeluaran
            </button>
<div class="h-6"></div> <!-- Extra bottom padding above nav -->
</main>
<!-- BottomNavBar (from JSON, 'Add' is active) -->
<nav class="fixed bottom-0 w-full max-w-[390px] z-50 bg-surface-dark border-t border-outline shadow-[0px_-2px_0px_0px_rgba(0,0,0,1)] flex justify-around items-center h-16 px-2">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform w-16 h-full">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform w-16 h-full">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-label-sm text-label-sm">History</span>
</button>
<!-- ACTIVE STATE: Add -->
<button class="flex flex-col items-center justify-center text-primary-fixed font-bold hover:bg-surface-container-low active:scale-95 transition-transform w-16 h-full relative">
<div class="absolute top-0 w-8 h-1 bg-primary-fixed rounded-b-full"></div>
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-sm text-label-sm">Add</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform w-16 h-full">
<span class="material-symbols-outlined mb-1">target</span>
<span class="font-label-sm text-label-sm">Goals</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform w-16 h-full">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</button>
</nav>
</div>
</body></html>
